<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>熊熊大富翁 · 蜜熊岛大赛 v1.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============ 设计系统 v1.1「陶土暖阳」 ============
     主色 陶土橘 #cf6b4f / 深陶 #a34a33
     辅色 松绿 #2f5d50 / 纸面 #fdfaf2 / 墨 #33291f               */
  :root {
    --clay: #cf6b4f;
    --clay-hi: #e8875f;
    --clay-deep: #a34a33;
    --teal: #2f5d50;
    --teal-soft: #e2ece6;
    --cream: #f8f3e7;
    --paper: #fdfaf2;
    --ink: #33291f;
    --ink-soft: #7a6b52;
    --line: #e6dbc2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2ead7; color: var(--ink);
  }
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

  /* ============ 上屏：棋盘（满宽） ============ */
  #board-area { flex: 1; position: relative; min-height: 0; background: #f2ead7; }
  #scene-container { position: absolute; inset: 0; }
  #title-tag {
    position: absolute; top: 8px; left: 8px; z-index: 5;
    background: rgba(253,250,242,.88); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 12px; padding: 5px 12px;
    color: var(--clay-deep); font-family: "Noto Serif SC", serif; font-weight: 900;
    font-size: 12px; letter-spacing: 1px;
    box-shadow: 0 3px 12px rgba(120,80,40,.18);
  }
  #turn-banner {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 5;
    background: linear-gradient(135deg, var(--clay-hi), var(--clay-deep));
    color: #fff; font-weight: 700; padding: 6px 18px; border-radius: 999px;
    box-shadow: 0 4px 14px rgba(163,74,51,.35), inset 0 1px 0 rgba(255,255,255,.35);
    font-size: 12.5px; white-space: nowrap;
    border: 1px solid rgba(255,220,200,.6);
    max-width: 62vw; overflow: hidden; text-overflow: ellipsis;
  }

  /* ============ 下屏：操作板 ============ */
  #panel {
    height: 42vh; min-height: 310px; max-height: 480px;
    background:
      linear-gradient(150deg, rgba(207,107,79,.07), rgba(0,0,0,0) 40%),
      var(--paper);
    border-top: 2.5px solid var(--clay);
    box-shadow: 0 -8px 28px rgba(120,80,40,.22);
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    border-radius: 18px 18px 0 0;
  }
  #players {
    display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px;
    justify-content: center; flex: 0 0 auto;
  }
  .chip {
    background: #fff; border: 1.5px solid var(--line);
    border-radius: 999px; padding: 4px 12px;
    font-size: 12px; font-weight: 700; color: var(--ink);
    box-shadow: 0 2px 8px rgba(120,80,40,.10);
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
    transition: transform .15s, border-color .15s;
  }
  .chip:hover { transform: scale(1.05); border-color: var(--clay); }
  .chip.current {
    border-color: var(--clay); background: linear-gradient(160deg, #fdeee2, #fbdcc8);
    color: var(--clay-deep); box-shadow: 0 3px 10px rgba(207,107,79,.3);
  }
  .chip.dead { opacity: .4; filter: grayscale(1); }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }

  #action-area { flex: 1; display: flex; gap: 10px; min-height: 0; }

  /* 当前格子操作卡 */
  #tile-card {
    flex: 1.25; background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 3px 12px rgba(120,80,40,.08); min-height: 0; overflow-y: auto;
  }
  #tile-card .tc-empty { color: #b6a888; font-size: 12.5px; text-align: center; margin: auto; line-height: 1.7; }
  #tile-card .tc-title { font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 15px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  #tile-card .tc-title .reg { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: #fff; }
  #tile-card .tc-body { font-size: 12px; color: #5c4f3c; line-height: 1.65; white-space: pre-line; }
  #tile-card .tc-body b { color: var(--clay-deep); }
  #tile-card .tc-btns { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
  #tile-card .tc-btns button {
    flex: 1; min-width: 100px; border: 1px solid rgba(255,235,220,.8); border-radius: 999px;
    padding: 9px 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    color: #fff; background: linear-gradient(160deg, var(--clay-hi), var(--clay-deep));
    box-shadow: 0 4px 12px rgba(163,74,51,.35), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .12s, filter .12s;
  }
  #tile-card .tc-btns button:hover { transform: translateY(-1px); filter: brightness(1.05); }
  #tile-card .tc-btns button.tc-secondary { background: #efe7d2; color: var(--ink-soft); border-color: var(--line); box-shadow: none; }
  #tile-card .tc-btns button:disabled { filter: grayscale(.7); cursor: not-allowed; transform: none; }

  /* 日志区（松绿深底） */
  #log-box {
    flex: 1; min-height: 0; overflow-y: auto;
    background: linear-gradient(170deg, #275043, #1b3a30);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 8px 11px;
    display: flex; flex-direction: column; gap: 3px;
  }
  #log-box .ln { font-size: 11px; line-height: 1.5; color: #d9e4da; }
  #log-box .ln.l-card { color: #f2c94c; }
  #log-box .ln.l-bad { color: #ff9b8a; }
  #log-box .ln.l-good { color: #8fd6a4; }
  #log-box .ln.l-sys { color: #a9bdb2; }

  /* 掷骰列 */
  #roll-col { flex: 0 0 108px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #roll-btn {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #f2a37e, #cf6b4f 58%, #a34a33);
    color: #fff; font-size: 15px; font-weight: 900; border: none; cursor: pointer;
    font-family: inherit; letter-spacing: 1px; line-height: 1.4;
    box-shadow: 0 8px 22px rgba(163,74,51,.45), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 10px rgba(100,40,20,.35);
    border: 2px solid rgba(255,230,215,.8);
    display: none; transition: transform .12s, filter .12s;
  }
  #roll-btn:hover { filter: brightness(1.06); }
  #roll-btn:active { transform: scale(.95); }
  #roll-btn:disabled { filter: grayscale(.7); cursor: not-allowed; }
  #dice-result { font-size: 24px; font-weight: 900; color: var(--clay-deep); display: none; }

  /* ============ 弹窗 ============ */
  #modal-mask {
    position: fixed; inset: 0; background: rgba(70, 50, 30, .45);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #modal {
    background: var(--paper);
    border: 1px solid rgba(207,107,79,.45);
    outline: 4px solid rgba(207,107,79,.10);
    border-radius: 20px; padding: 22px 24px;
    width: 380px; max-width: 92vw; max-height: 86vh; overflow-y: auto;
    box-shadow: 0 24px 70px rgba(90,60,30,.4);
    text-align: center; animation: pop .22s ease-out;
  }
  @keyframes pop { from { transform: scale(.86) translateY(10px); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #modal h3 {
    font-family: "Noto Serif SC", serif; font-weight: 900;
    color: var(--ink); margin-bottom: 12px; font-size: 18px;
    padding-bottom: 10px; border-bottom: 1px solid rgba(207,107,79,.3);
  }
  #modal .m-body { color: #5c4f3c; font-size: 13.5px; line-height: 1.75; margin-bottom: 18px; white-space: pre-line; text-align: left; }
  #modal .m-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #modal button {
    border: 1px solid rgba(255,235,220,.8); border-radius: 999px; padding: 10px 26px; font-size: 15px;
    font-weight: 700; cursor: pointer; color: #fff; font-family: inherit;
    background: linear-gradient(160deg, var(--clay-hi), var(--clay-deep));
    box-shadow: 0 4px 14px rgba(163,74,51,.35), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .12s, filter .12s;
  }
  #modal button:hover { transform: translateY(-1px); filter: brightness(1.06); }
  #modal button.secondary { background: #efe7d2; color: var(--ink-soft); border-color: var(--line); box-shadow: none; }
  #modal .card-face {
    background: linear-gradient(160deg, #fffdf8, #fbf0dd);
    border: 1.5px solid var(--clay); border-radius: 14px;
    padding: 16px; margin-bottom: 16px;
    box-shadow: inset 0 0 30px rgba(207,107,79,.08);
  }
  #modal .card-face .c-name { font-family: "Noto Serif SC", serif; font-size: 20px; font-weight: 900; color: var(--clay-deep); margin-bottom: 7px; }
  #modal .card-face .c-rarity { font-size: 11px; border-radius: 6px; padding: 2px 9px; display: inline-block; margin-bottom: 9px; }
  #modal .card-face .c-desc { font-size: 13px; color: #5c4f3c; }

  /* 摊牌选卡 */
  #modal .pick-sub { color: #8a7a58; font-size: 12.5px; margin-bottom: 14px; }
  #modal .pick-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 6px; flex-wrap: wrap; }
  #modal .pick-card { cursor: pointer; transition: transform .15s; }
  #modal .pick-card:hover { transform: translateY(-6px); }
  #modal .pick-card.dim { opacity: .35; transform: scale(.94); pointer-events: none; }
  #modal .pick-card.picked { transform: translateY(-6px); }
  #modal .pick-back {
    width: 96px; height: 138px; border-radius: 12px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.3), rgba(0,0,0,0) 55%),
      repeating-linear-gradient(45deg, var(--teal) 0 7px, #24463c 7px 14px);
    border: 2px solid var(--teal); box-shadow: 0 8px 20px rgba(0,0,0,.25), inset 0 0 0 4px rgba(253,250,242,.9), inset 0 0 0 5px rgba(47,93,80,.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-size: 28px; color: rgba(253,250,242,.9);
  }
  #modal .pick-back span {
    font-family: "Noto Serif SC", serif; font-size: 19px; font-weight: 900; color: #ffd9a8;
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  #modal .pick-front {
    width: 110px; height: 150px; border-radius: 12px;
    background: linear-gradient(165deg, #fffdf8, #f8eeda);
    border: 2px solid var(--clay); box-shadow: 0 10px 26px rgba(0,0,0,.25);
    padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; overflow: hidden;
  }
  #modal .pick-front .c-rarity { font-size: 10px; border-radius: 5px; padding: 1px 6px; }
  #modal .pick-front .c-name { font-family: "Noto Serif SC", serif; font-size: 14px; font-weight: 900; color: var(--clay-deep); }
  #modal .pick-front .c-desc { font-size: 10.5px; color: #6b5d43; line-height: 1.5; }

  /* ============ 开局设置 ============ */
  #setup {
    position: fixed; inset: 0; z-index: 100;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(207,107,79,.16), rgba(0,0,0,0) 55%),
      radial-gradient(ellipse at 85% 100%, rgba(47,93,80,.12), rgba(0,0,0,0) 50%),
      linear-gradient(165deg, #f6ead2 0%, #f2ddc0 55%, #eecdaf 100%);
    display: flex; align-items: center; justify-content: center; overflow: auto;
  }
  #setup .box {
    background: rgba(253, 250, 242, .97);
    border: 1px solid rgba(207,107,79,.45);
    outline: 6px solid rgba(207,107,79,.08);
    border-radius: 24px; padding: 26px 30px;
    box-shadow: 0 30px 90px rgba(120,70,30,.3);
    text-align: center;
    max-width: 920px; width: min(94vw, 920px);
    display: grid; grid-template-columns: 1fr 1.15fr; gap: 10px 34px; align-items: start;
  }
  #setup .left-col { display: flex; flex-direction: column; align-items: center; }
  #setup .right-col { display: flex; flex-direction: column; align-items: center; }
  #setup h1 {
    font-family: "Noto Serif SC", serif; font-weight: 900;
    font-size: 30px; margin-bottom: 4px;
    background: linear-gradient(160deg, var(--clay-deep), var(--clay-hi) 50%, var(--clay-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 3px;
  }
  #setup .sub { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 6px; line-height: 1.6; }
  #setup .sec-title {
    color: var(--clay-deep); font-weight: 700; margin: 13px 0 8px; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  #setup .sec-title::before, #setup .sec-title::after {
    content: ""; height: 1px; width: 18px; background: linear-gradient(90deg, rgba(207,107,79,0), rgba(207,107,79,.7));
  }
  #setup .sec-title::after { transform: scaleX(-1); }
  #setup .count-btns button {
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 12px; padding: 8px 22px; margin: 0 5px; font-size: 15px; cursor: pointer;
    font-weight: 700; font-family: inherit; transition: all .15s;
    box-shadow: 0 2px 8px rgba(120,80,40,.08);
  }
  #setup .count-btns button:hover { border-color: var(--clay); }
  #setup .count-btns button.on {
    border-color: var(--clay); background: linear-gradient(160deg, #fdeee2, #fbdcc8); color: var(--clay-deep);
    box-shadow: 0 3px 12px rgba(207,107,79,.25);
  }
  #setup .bears { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
  #setup .bear {
    width: 90px; background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
    padding: 11px 6px 9px; cursor: pointer; transition: all .15s;
    box-shadow: 0 3px 12px rgba(120,80,40,.08);
  }
  #setup .bear:hover { transform: translateY(-4px); border-color: var(--clay); }
  #setup .bear.on {
    border-color: var(--clay); background: linear-gradient(170deg, #fdf3e9, #f9e2cd);
    transform: translateY(-4px); box-shadow: 0 8px 22px rgba(207,107,79,.3);
  }
  #setup .bear .swatch {
    width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 6px;
    border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25), inset 0 -3px 6px rgba(0,0,0,.15);
  }
  #setup .bear .b-name { font-family: "Noto Serif SC", serif; font-weight: 900; color: var(--ink); font-size: 14px; }
  #setup .bear .b-trait { font-size: 10px; color: var(--ink-soft); margin-top: 4px; line-height: 1.45; }
  #setup #start-btn {
    margin-top: 24px; border: 1px solid rgba(255,235,220,.8);
    background: linear-gradient(160deg, var(--clay-hi) 0%, var(--clay) 55%, var(--clay-deep) 100%);
    color: #fff; font-size: 18px; font-weight: 900; padding: 13px 54px; border-radius: 999px;
    cursor: pointer; font-family: inherit; letter-spacing: 4px;
    box-shadow: 0 10px 30px rgba(163,74,51,.45), inset 0 1.5px 0 rgba(255,255,255,.35);
    transition: transform .12s, filter .12s;
  }
  #setup #start-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
  #setup .tip { font-size: 11px; color: #a39471; margin-top: 13px; grid-column: 1 / -1; }

  @media (max-width: 760px), (orientation: portrait) {
    #setup .box { padding: 16px 18px; gap: 6px 16px; border-radius: 18px; }
    #setup h1 { font-size: 21px; letter-spacing: 1px; }
    #setup .sub { font-size: 11px; }
    #setup .sec-title { font-size: 12px; margin: 9px 0 6px; }
    #setup .count-btns button { padding: 5px 13px; margin: 0 3px; font-size: 12px; }
    #setup .bear { width: 74px; padding: 8px 4px 7px; border-radius: 12px; }
    #setup .bear .swatch { width: 27px; height: 27px; border-width: 2px; }
    #setup .bear .b-name { font-size: 12px; }
    #setup .bear .b-trait { font-size: 9px; }
    #setup #start-btn { font-size: 15px; padding: 10px 38px; margin-top: 14px; letter-spacing: 2px; }
    #setup .tip { font-size: 10px; }
  }
  #rotate-tip { display: none; }
  @media (orientation: landscape) and (max-height: 500px) {
    #rotate-tip {
      display: block; margin: 8px auto 0; max-width: 300px;
      background: #f9e2cd; border: 1.5px solid var(--clay); border-radius: 12px;
      padding: 6px 10px; color: var(--clay-deep); font-size: 11px; font-weight: 700;
      grid-column: 1 / -1;
    }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="board-area">
      <div id="scene-container"></div>
      <div id="title-tag">蜜熊岛大富翁<small style="font-weight:500;color:#a39471;margin-left:6px;font-family:'Noto Sans SC',sans-serif;letter-spacing:0">v1.1</small></div>
      <div id="turn-banner">…</div>
    </div>
    <div id="panel">
      <div id="players"></div>
      <div id="action-area">
        <div id="tile-card"><div class="tc-empty">棋盘上点击任意格子可查看详情<br>轮到你时，操作会出现在这里</div></div>
        <div id="log-box"></div>
        <div id="roll-col">
          <div id="dice-result"></div>
          <button id="roll-btn">掷<br>骰<br>子</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-mask"><div id="modal"></div></div>

  <div id="setup">
    <div class="box">
      <div class="left-col">
        <h1>蜜熊岛大富翁</h1>
        <div class="sub">熊熊岛年度财富之争 · 淘汰制<br>最后留下的熊熊，加冕年度首富！</div>
        <div class="sec-title">参赛熊熊数量（你是其中 1 位真人）</div>
        <div class="count-btns">
          <button data-n="3" class="on">3 位</button>
          <button data-n="4">4 位</button>
        </div>
        <div class="sec-title">AI 难度</div>
        <div class="count-btns diff-btns">
          <button data-d="easy">😌 简单</button>
          <button data-d="normal" class="on">🙂 普通</button>
          <button data-d="hard">😤 困难</button>
        </div>
        <button id="start-btn">开始比赛</button>
      </div>
      <div class="right-col">
        <div class="sec-title">选择你的熊熊角色</div>
        <div class="bears" id="bear-pick"></div>
      </div>
      <div id="rotate-tip">📱 建议竖屏游玩：上面看棋盘，下面做操作</div>
      <div class="tip">竖屏双区设计 · 上屏棋盘满宽展示（拖动平移/缩放/点格子看详情）· 下屏操作板（掷骰 / 买地 / 升级 / 付租 / 日志）</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
